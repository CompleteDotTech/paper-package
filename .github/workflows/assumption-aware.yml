name: Assumption-aware graph synthesis
on:
  push:
    branches: [main, research/assumption-aware-graph-synthesis]
  pull_request:
permissions:
  contents: read
concurrency:
  group: assumption-aware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  execute-and-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/assumption-aware-graph-synthesis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/assumption_aware/requirements.txt
      - name: Execute frozen hypotheses, regressions and replay
        shell: bash
        run: |
          set -euo pipefail
          python -B -m graph_synthesis.assumption_aware.run | tee graph_synthesis/assumption_aware/execution.log
          python -B -m unittest discover -s graph_synthesis/assumption_aware/tests -v 2>&1 | tee graph_synthesis/assumption_aware/tests.log
          python -B -m graph_synthesis.assumption_aware.run --check
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/assumption-original.json"
          cp "$RUNNER_TEMP/assumption-original.json" graph_synthesis/assumption_aware/original-inventory.json
          python - <<'PY'
          import json,platform,numpy,scipy,matplotlib
          from pathlib import Path
          result={'python':platform.python_version(),'platform':platform.platform(),'numpy':numpy.__version__,'scipy':scipy.__version__,'matplotlib':matplotlib.__version__,'note':'Operation-count experiments; no wall-clock speedup claim.'}
          Path('graph_synthesis/assumption_aware/environment.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          PY
          python -B -m graph_synthesis.assumption_aware.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
          python -B -m graph_synthesis.assumption_aware.verify_artifacts
      - name: Commit generated evidence on this research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph_synthesis/assumption_aware CURRENT_RESULTS.md manuscript/paper-current.md manuscript/paper-current.pdf manuscript/paper-current.html manuscript/paper-current.build.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record five executed assumption-aware tests and complete updated paper'
            git push origin HEAD:research/assumption-aware-graph-synthesis
          fi
          git archive --format=zip HEAD -o "$RUNNER_TEMP/assumption-aware-repository.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: assumption-aware-review-package
          path: |
            ${{ runner.temp }}/assumption-aware-repository.zip
            graph_synthesis/assumption_aware/
            manuscript/paper-current.pdf
            manuscript/paper-current.md
            manuscript/paper-current.html
            manuscript/paper-current.build.json
            CURRENT_RESULTS.md
          retention-days: 14
  replay:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/assumption_aware/requirements.txt
      - name: Replay, independent oracle tests and artifact integrity
        run: |
          python -B -m unittest discover -s graph_synthesis/assumption_aware/tests -v
          python -B -m graph_synthesis.assumption_aware.run --check
          python -B -m graph_synthesis.assumption_aware.verify_artifacts
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/assumption-original.json"
          git diff --exit-code
  figures-and-paper:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/assumption_aware/requirements.txt
      - name: Rebuild all new figures and preserve the complete manuscript
        run: |
          python -B -m graph_synthesis.assumption_aware.report --figures --update-paper
          git diff --exit-code -- graph_synthesis/assumption_aware manuscript/paper-current.md CURRENT_RESULTS.md
          python -B -m graph_synthesis.render_current_paper --output "$RUNNER_TEMP/assumption-paper.pdf"
          git diff --exit-code -- manuscript/paper-current.html
