name: Build graph figure revision once
on:
  push:
    branches: [research/graph-evidence-figures]
    paths:
      - '.github/figure-revision/**'
      - '.github/workflows/build-graph-figures-once.yml'
permissions:
  contents: write
concurrency:
  group: graph-figure-revision-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/graph-evidence-figures
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Archive transfer inputs
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/source.tar"
      - name: Verify and apply exact locally reviewed revision
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          parts = sorted(pathlib.Path('.github/figure-revision').glob('part-*.b64'))
          assert len(parts) == 5, 'Expected exactly five transfer parts'
          encoded = ''.join(p.read_text().strip() for p in parts)
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'd05978ba535222b1584260ec9b31913549606ac04ba0c494056496a616403e57', 'Revision integrity failure'
          subprocess.run(['git', 'apply', '--check', '-'], input=data, check=True)
          subprocess.run(['git', 'apply', '-'], input=data, check=True)
          PY
      - name: Install pinned renderer
        run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Build and verify all figures
        run: |
          python -B -m graph_synthesis.visualize
          python -B -m graph_synthesis.visualize --check
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/frozen-verification.json"
          python -B -m unittest discover -s graph_synthesis/tests -v
      - name: Commit generated source, tables, SVG and high-resolution PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GRAPH_SYNTHESIS.md graph_synthesis/CLAIM_EVIDENCE.md graph_synthesis/README.md graph_synthesis/VISUAL_ANALYSIS.md graph_synthesis/paper.md graph_synthesis/requirements-figures.txt graph_synthesis/tests/test_visualize.py graph_synthesis/visualize.py graph_synthesis/figures
          git diff --cached --check
          git commit -m 'Add reproducible graph-synthesis visual evidence and revised manuscript'
          git push origin HEAD:research/graph-evidence-figures
          git archive --format=tar HEAD -o "$RUNNER_TEMP/source.tar"
      - name: Archive actual source and verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: figure-revision-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source.tar
            ${{ runner.temp }}/frozen-verification.json
          if-no-files-found: error
          retention-days: 7
