name: Finalize PR20 research integration
on:
  push:
    branches: [research/dependence-aware-certificates]
permissions:
  contents: read
concurrency:
  group: finalize-certificates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/certificates/requirements.txt
      - name: Record merge-time overlap without changing frozen experiments
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('graph_synthesis/certificates/report.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace("ANCHOR = '<!-- STRUCTURAL_RESEARCH_END -->'", "ANCHOR = '<!-- FRONTIER_RESEARCH_END -->'")
          t=t.replace('Expected exactly one structural-section anchor','Expected exactly one frontier-section anchor')
          t=t.replace('The inspected repository inventory did not contain these five integrated experiments.', 'At the frozen PR #17 baseline, the inspected inventory did not contain these five integrated experiments. At merge time, several parallel studies overlap with H2-H4; those methods are concurrent extensions or replications, not five distinct new mechanisms relative to current main. See the [merge-time overlap audit](MERGE_AUDIT.md).')
          t=t.replace('repository-scoped new-experiment claim, not a worldwide first-attempt claim','new-experiment claim scoped to the frozen baseline, not to the current inventory or worldwide priority')
          t=t.replace('No fresh Jev calls, worldwide novelty claim, new semantic-accuracy claim or production-policy change.', 'Concurrent overlap with H2-H4 is documented in the merge-time audit. No fresh Jev calls, worldwide novelty claim, new semantic-accuracy claim or production-policy change.')
          p.write_text(t,encoding='utf-8',newline='\n')
          base=Path('graph_synthesis/certificates')
          (base/'MERGE_AUDIT.md').write_text('''# PR #20 merge-time overlap and preservation audit

          Reviewed main: `c726b66c3a07a115eb928b3f2629de972c728083`. Original experiment baseline and protocol remain `a62a3257645d8e35cd4e45be53bfa9511d27724b` and `bc70b76621daca198b3b97eb4f698b17d4c40a0b`. No primary endpoint, decision rule or comparator was retuned on resumption. The five original executed outcomes are retained, including H1 failure.

          The repository's [current-results inventory](../../CURRENT_RESULTS.md) now includes several parallel studies completed while PR #20 remained open. Therefore this merge does **not** establish five distinct never-before-attempted mechanisms relative to current main, nor worldwide priority. It preserves five baseline-scoped experiments and additional controlled replication evidence.

          | Certificate experiment | Relationship to intervening work | Merge-time interpretation |
          |---|---|---|
          | H1 source beta-binomial random effects | The [source-structural study](../source_structural/RESULTS.md) also studies direct source risk, but this experiment freezes an exchangeable count model and same-marginal comparator. | Different fitted forecast; H1 target still fails. |
          | H2 arbitrary-dependence DNF LP | The [assumption-aware](../assumption_aware/RESULTS.md), [uncertainty](../uncertainty/RESULTS.md) and [novel-mechanisms](../novel_mechanisms/RESULTS.md) studies also investigate marginal/dependence-safe probabilities. | Overlapping probability-bound research with explicit conjunction constraints and saved LP witnesses; not an independent new mathematical idea. |
          | H3 bipartite min-cut certificates | [Source-structural](../source_structural/RESULTS.md), [novel-mechanisms](../novel_mechanisms/RESULTS.md) and [frontier](../frontier/RESULTS.md) studies also execute bipartite optimization. | Concurrent replication/implementation extension; do not count repeatedly as distinct novelty. |
          | H4 repair-invariant queries | [Assumption-aware](../assumption_aware/RESULTS.md) and [uncertainty](../uncertainty/RESULTS.md) studies also expose alternative repairs. | Overlapping repair semantics; this suite additionally records exact and 5%-tolerant conjunctive witnesses. |
          | H5 component-local delta index | The connected-tree/path updates in [assumption-aware](../assumption_aware/RESULTS.md) and [frontier](../frontier/RESULTS.md) target different locality regimes. | Explicit mutable component index with insert/delete/split operations; connected control still has zero counted saving. |

          Main's generic research-marker renderer, all intervening study source/results, the original 161-file inventory, and the DSPy optimizer are preserved. Only the certificate subtree, its CI integration and additive current manuscript/index are changed. The complete paper appends the certificate section after the frontier section. Preservation is checked by removing only the new certificate block and requiring byte-identical pre-existing Markdown.

          Primary-source metadata was checked on September 18, 2026: [Kaski, Mannila and Mohapatra](https://arxiv.org/abs/2605.03556); [Faour, Fuchs and Kuhn](https://arxiv.org/abs/2111.10577); [Pardal et al.](https://arxiv.org/abs/2402.09265); [Staworko and Chomicki](https://arxiv.org/abs/0809.1551); [SciPy HiGHS documentation](https://docs.scipy.org/doc/scipy-1.17.0/reference/optimize.linprog-highs.html). Bibliographic correction: the frozen protocol's shortened Faour/Kuhn author attribution omits Marc Fuchs; the complete author list is recorded here without rewriting the frozen protocol. These sources document antecedents, not validation of this implementation.

          No new Jev calls, independent source-disjoint semantic test, matched KARMA run, real reviewer experiment or production-policy change is claimed. This is an author-side engineering integration audit, not independent external scientific peer review.
          '''.replace('\n          ','\n'),encoding='utf-8')
          (Path('/tmp')/'pr20-before-results.json').write_bytes((base/'results.json').read_bytes())
          PY
      - name: Re-execute benchmarks and check unchanged scientific outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -B -m graph_synthesis.certificates.run | tee graph_synthesis/certificates/execution.log
          python -B -m graph_synthesis.certificates.run --check
          python - <<'PY'
          import json
          from pathlib import Path
          from graph_synthesis.verify import compare_json
          before=json.loads(Path('/tmp/pr20-before-results.json').read_text())
          after=json.loads(Path('graph_synthesis/certificates/results.json').read_text())
          changes={k:compare_json(before[k],after[k]) for k in ('H1','H2','H3','H4','H5')}
          Path('graph_synthesis/certificates/integration-replay.json').write_text(json.dumps({'scientific_outcomes_unchanged':True,'roundoff':changes,'fresh_service_calls':0},indent=2)+'\n')
          print('All five previously frozen outcomes preserved')
          PY
      - name: Execute combined regression suites
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest discover -s graph_synthesis/certificates/tests -v 2>&1 | tee graph_synthesis/certificates/tests.log
          python - <<'PY'
          import json,re,subprocess,sys
          from pathlib import Path
          records=[]; logs=[]
          names=('tests','followup/tests','adaptive/tests','risk_control/tests','reliability/tests','structural/tests','source_structural/tests','assumption_aware/tests','uncertainty/tests','novel_mechanisms/tests','frontier/tests','certificates/tests')
          for name in names:
              path='graph_synthesis/'+name
              assert Path(path).is_dir(),path
              done=subprocess.run([sys.executable,'-B','-m','unittest','discover','-s',path,'-v'],capture_output=True,text=True)
              text=done.stdout+done.stderr
              logs.append(path+'\n'+text)
              print(path,done.returncode,flush=True)
              assert done.returncode==0,text
              found=re.search(r'Ran (\d+) tests?',text)
              assert found,text
              skipped=re.search(r'skipped=(\d+)',text)
              records.append({'path':path,'tests':int(found.group(1)),'skipped':int(skipped.group(1)) if skipped else 0,'returncode':done.returncode})
          base=Path('graph_synthesis/certificates')
          (base/'combined-tests.log').write_text('\n'.join(logs),encoding='utf-8')
          (base/'combined-validation.json').write_text(json.dumps({'suites':records,'total_tests':sum(x['tests'] for x in records),'skipped':sum(x['skipped'] for x in records),'failures':0},sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/pr20-inventory.json"
          cp "$RUNNER_TEMP/pr20-inventory.json" graph_synthesis/certificates/original-inventory.json
      - name: Render complete paper and verify additive preservation
        shell: bash
        run: |
          set -euo pipefail
          python -B -m graph_synthesis.certificates.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
          python - <<'PY'
          import re,subprocess,json
          from pathlib import Path
          main='c726b66c3a07a115eb928b3f2629de972c728083'
          for name in ('manuscript/paper-current.md','CURRENT_RESULTS.md'):
              before=subprocess.check_output(['git','show',f'{main}:{name}']).decode('utf-8')
              after=Path(name).read_text(encoding='utf-8')
              restored=re.sub(r'<!-- CERTIFICATES_RESEARCH_START -->.*?<!-- CERTIFICATES_RESEARCH_END -->\n\n','',after,flags=re.S)
              assert restored==before,name+' lost or altered pre-existing text'
          changed=subprocess.check_output(['git','diff','--name-only',main],text=True).splitlines()
          allowed={'.github/workflows/dependence-certificates.yml','.github/workflows/certificates-finalize.yml','.github/workflows/jev-multicall.yml','CURRENT_RESULTS.md','manuscript/paper-current.md','manuscript/paper-current.html','manuscript/paper-current.pdf','manuscript/paper-current.build.json'}
          assert all(x in allowed or x.startswith('graph_synthesis/certificates/') for x in changed),changed
          print('All prior study text, DSPy code, renderer and archived evidence preserved')
          PY
      - name: Publish generated contents on PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph_synthesis/certificates CURRENT_RESULTS.md manuscript/paper-current.md manuscript/paper-current.pdf manuscript/paper-current.html manuscript/paper-current.build.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: preserve all parallel studies and revalidate PR20 certificate results'
            git push origin HEAD:research/dependence-aware-certificates
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr20-final-integration
          path: |
            graph_synthesis/certificates/
            manuscript/paper-current.*
            CURRENT_RESULTS.md
          retention-days: 14
