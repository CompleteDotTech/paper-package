name: Corpus methodology
on:
  pull_request:
    paths:
      - 'graph_synthesis/corpus/**'
      - 'LARGE_CORPUS_METHODOLOGY.md'
      - '.github/workflows/corpus-methodology.yml'
  push:
    branches: [main]
    paths:
      - 'graph_synthesis/corpus/**'
      - 'LARGE_CORPUS_METHODOLOGY.md'
      - '.github/workflows/corpus-methodology.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-planning-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate offline corpus planner
        run: python -B -m unittest discover -s graph_synthesis/corpus/tests -v
      - name: Ensure tests do not modify tracked artifacts
        run: git diff --exit-code
