name: Repeated DSPy Jev benchmarks
on:
  pull_request:
    paths: ['graph_synthesis/dspy_benchmark/**', '.github/workflows/dspy-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -B -m unittest discover -s graph_synthesis/dspy_benchmark/tests -v
      - run: python -B -m graph_synthesis.dspy_jev_optimizer.verify
  live:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'CompleteDotTech/paper-package'
    needs: offline
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [11, 23, 37, 53, 71]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/dspy_benchmark/requirements.txt
      - name: Pin resolved dependency record
        run: python -m pip freeze > '${{ runner.temp }}/environment.txt'
      - name: Live repeated comparison
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DSPY_PROPOSER_MODEL: ${{ vars.DSPY_PROPOSER_MODEL }}
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: python -B -m graph_synthesis.dspy_benchmark.run --seed ${{ matrix.seed }} --iterations 8 --workers 4 --output '${{ runner.temp }}/comparison/seed-${{ matrix.seed }}'
      - name: Generate report without inventing missing runs
        if: always()
        run: python -B -m graph_synthesis.dspy_benchmark.report --directory '${{ runner.temp }}/comparison'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dspy-jev-seed-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/comparison
            ${{ runner.temp }}/environment.txt
          retention-days: 14
          if-no-files-found: warn
