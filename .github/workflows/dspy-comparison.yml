name: Repeated DSPy Jev benchmarks
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'One registered seed; review usage before the next dispatch'
        required: true
        type: choice
        options: ['11', '23', '37', '53', '71']
permissions:
  contents: read
jobs:
  benchmark:
    if: github.repository == 'CompleteDotTech/paper-package'
    runs-on: paper-package-live-20260928
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r graph_synthesis/dspy_benchmark/requirements.txt
      - name: Offline gate
        run: |
          python -B -m unittest discover -s graph_synthesis/dspy_benchmark/tests -v
          python -B -m graph_synthesis.dspy_jev_optimizer.verify
          python -B -m graph_synthesis.verify
      - name: Pin resolved dependency record
        run: |
          mkdir -p '${{ runner.temp }}/comparison'
          python -m pip freeze > '${{ runner.temp }}/comparison/environment-seed-${{ inputs.seed }}.txt'
      - name: Live selected seed
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OMNIROUTE_DEEPSEEK_API_KEY }}
          DSPY_PROPOSER_MODEL: openai/ollamacloud/deepseek-v4.1-flash
          DSPY_PROPOSER_API_BASE: https://train.home.complete.tech:20128/v1
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: python -B -m graph_synthesis.dspy_benchmark.run --seed ${{ inputs.seed }} --iterations 8 --workers 4 --output '${{ runner.temp }}/comparison/seed-${{ inputs.seed }}'
      - name: Report available evidence
        if: always()
        run: python -B -m graph_synthesis.dspy_benchmark.report --directory '${{ runner.temp }}/comparison'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dspy-jev-seed-${{ inputs.seed }}-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison/
          retention-days: 14
          if-no-files-found: warn
