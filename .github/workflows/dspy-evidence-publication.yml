name: Publish complete audited DSPy benchmark evidence
on:
  pull_request:
    paths:
      - 'graph_synthesis/dspy_publication/**'
      - '.github/workflows/dspy-evidence-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dspy-evidence-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'study/dspy-benchmark-results'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen inventory and publication safety regressions
        run: |
          python -B -m graph_synthesis.dspy_jev_optimizer.verify
          python -B -m unittest graph_synthesis.dspy_publication.test_publish -v
      - name: Require the complete successful independent audit before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/CompleteDotTech/paper-package/actions/runs/35345560822'
          for attempt in range(200):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:run=json.load(response)
              assert run['head_sha']=='f197f9f24076bf85b7739916669dae9fdb428adf','Unexpected source commit'
              if run['status']=='completed':
                  assert run['conclusion']=='success','Audit incomplete or failed: no full-results publication permitted'
                  print('Independent full evidence audit succeeded; publication authorized.')
                  break
              time.sleep(30)
          else:raise RuntimeError('Bounded audit dependency window expired')
          PY
      - name: Retrieve the exact audited package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 35345560822 --repo CompleteDotTech/paper-package
          --name dspy-final-complete-evidence --dir "$RUNNER_TEMP/audited-evidence"
      - name: Verify every byte and publish all comparisons without model calls
        run: |
          python -B -m graph_synthesis.dspy_publication.publish --input "$RUNNER_TEMP/audited-evidence" --repo .
          python -B -m graph_synthesis.dspy_jev_optimizer.verify
          git diff --exit-code -- MANIFEST.json graph_synthesis/dspy_jev_optimizer reproduction manuscript
      - name: Commit only the new evidence package and entry point to the dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          CURRENT="$(git ls-remote origin refs/heads/study/dspy-benchmark-results | cut -f1)"
          test "$CURRENT" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/dspy-calibration-20260918/results DSPY_BENCHMARK_RESULTS.md
          python - <<'PY'
          import subprocess,pathlib
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(p.startswith('experiments/dspy-calibration-20260918/results/') or p=='DSPY_BENCHMARK_RESULTS.md' for p in paths)
          assert all(pathlib.Path(p).stat().st_size<95_000_000 for p in paths),'Oversized Git blob'
          PY
          git commit -m 'Publish audited live DSPy, calibration, multi-call and repeatability benchmark evidence'
          git push origin HEAD:refs/heads/study/dspy-benchmark-results
          git rev-parse HEAD
      - name: Preserve publication-ready evidence for independent access
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dspy-published-comparison
          path: |
            experiments/dspy-calibration-20260918/results/
            DSPY_BENCHMARK_RESULTS.md
          retention-days: 30
          if-no-files-found: warn
