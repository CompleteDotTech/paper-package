name: DSPy Jev optimizer
on:
  pull_request:
    paths:
      - 'graph_synthesis/dspy_jev_optimizer/**'
      - '.github/workflows/dspy-jev-optimizer.yml'
  push:
    branches: [main]
    paths:
      - 'graph_synthesis/dspy_jev_optimizer/**'
      - '.github/workflows/dspy-jev-optimizer.yml'
permissions:
  contents: read
concurrency:
  group: dspy-jev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify optimizer and frozen inventory
        run: python -B -m graph_synthesis.dspy_jev_optimizer.verify
      - name: Offline regressions
        run: python -B -m unittest discover -s graph_synthesis/dspy_jev_optimizer/tests -v
      - name: Synthetic end-to-end wiring test
        run: python -B -m graph_synthesis.dspy_jev_optimizer.optimize demo --output "${{ runner.temp }}/jev-demo" --cache "${{ runner.temp }}/jev-cache.sqlite3"
  sdk-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQUIRE_SDK_TESTS: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned SDKs
        run: python -m pip install -r graph_synthesis/dspy_jev_optimizer/requirements-test.txt
      - name: Real SDKs with mocked inference
        run: python -B -m unittest discover -s graph_synthesis/dspy_jev_optimizer/tests -v
      - name: Record resolved dependency environment
        run: python -m pip freeze > "${{ runner.temp }}/jev-environment.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dspy-jev-environment
          path: ${{ runner.temp }}/jev-environment.txt
          retention-days: 7
