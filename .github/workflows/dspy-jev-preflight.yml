name: DSPy Jev live preflight
on:
  push:
    branches: [research/dspy-jev-benchmark]
    paths: ['.github/workflows/dspy-jev-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'CompleteDotTech/paper-package'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/dspy_jev_optimizer/requirements.txt
      - name: Bounded live connectivity tests
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || secrets.JEV_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DSPY_PROPOSER_MODEL: ${{ vars.DSPY_PROPOSER_MODEL }}
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from graph_synthesis.dspy_jev_optimizer.core import JevConfig
          from graph_synthesis.dspy_jev_optimizer.providers import TypeSafeBackend, DSPyProposer
          presence = {k: bool(os.environ.get(k, '').strip()) for k in ('TYPESAFE_API_KEY','OPENROUTER_API_KEY','OPENAI_API_KEY','ANTHROPIC_API_KEY')}
          result = {'credential_present': presence, 'status': 'started'}
          out = Path(os.environ['RUNNER_TEMP']) / 'preflight.json'
          cfg = JevConfig('Evidence classification', 'Does the evidence support the claim?', {'supports':'Evidence establishes the claim.', 'refutes':'Evidence contradicts the claim.', 'unknown':'Evidence is insufficient.'})
          try:
              if not presence['TYPESAFE_API_KEY']:
                  raise ValueError('TypeSafe credential is not mapped')
              model = os.environ.get('DSPY_PROPOSER_MODEL','').strip()
              if not model:
                  model = ('openrouter/anthropic/claude-sonnet-4.5' if presence['OPENROUTER_API_KEY'] else 'anthropic/claude-sonnet-4-5-20250929' if presence['ANTHROPIC_API_KEY'] else 'openai/gpt-4.1' if presence['OPENAI_API_KEY'] else '')
              if not model:
                  raise ValueError('No proposal-provider credential is mapped')
              result['proposer_model'] = model
              backend = TypeSafeBackend('jev-1.13.0', retries=0)
              try:
                  answer = backend.predict(cfg, {'claim':'A precedes B.', 'evidence':['A precedes B.']})
              finally:
                  backend.close()
              result['jev'] = {'model':answer['model'], 'choice':answer['choice'], 'usage':answer['usage']}
              proposal = DSPyProposer(model).propose(cfg, [{'state':{'claim':'A precedes B.', 'evidence':['A precedes B.']}, 'gold':'supports', 'choice':'unknown', 'probabilities':{'supports':0.3,'refutes':0.1,'unknown':0.6}}], 1, [])
              JevConfig.from_dict(proposal, cfg)
              result['status'] = 'passed'
          except Exception as exc:
              result['status'] = 'failed'
              result['error_type'] = type(exc).__name__
          finally:
              out.write_text(json.dumps(result, indent=2)+'\n')
              print(json.dumps(result))
          if result['status'] != 'passed':
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dspy-jev-live-preflight
          path: ${{ runner.temp }}/preflight.json
          retention-days: 14
          if-no-files-found: warn
