name: Live DSPy multi-call transfer benchmarks
on:
  pull_request:
    paths:
      - '.github/workflows/dspy-multicall.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dspy-multicall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  upstream:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -B -m unittest graph_synthesis.dspy_multicall.test_run -v
      - name: Require successful frozen upstream; no test-based seed selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base='https://api.github.com/repos/CompleteDotTech/paper-package/actions/'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          run=get('runs/35340617823')
          assert run['head_sha']=='9e97de8fa1fe8c9158e5febbe8fd22b8e850e1db'
          for attempt in range(160):
              job=get('jobs/105585686405')
              if job['status']=='completed':
                  assert job['conclusion']=='success', 'Upstream capture failed; no transfer inference from an incomplete capture.'
                  print('Pinned upstream few-shot capture completed successfully.')
                  break
              time.sleep(30)
          else:raise RuntimeError('Upstream capture did not finish within the bounded dependency window')
          PY
  live:
    needs: upstream
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Retrieve the pinned upstream capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download 35340617823
          --repo CompleteDotTech/paper-package
          --name dspy-live-relation_support--fewshot_contract
          --dir "$RUNNER_TEMP/upstream"
      - name: Compare all seven workflows using the same five frozen prompts
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          CAPTURE="$(find "$RUNNER_TEMP/upstream" -name freeze.json -printf '%h\n' | head -1)"
          test -n "$CAPTURE"
          python -B -m graph_synthesis.dspy_multicall.run --capture "$CAPTURE" --shard '${{ matrix.shard }}' --output "$RUNNER_TEMP/multicall/shard-${{ matrix.shard }}"
      - name: Preserve raw transfer observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dspy-multicall-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/multicall/
          retention-days: 14
          if-no-files-found: warn
