name: Live DSPy multi-call transfer benchmarks
# Manual after the explicitly requested run; prevents repeat charges on documentation updates.
on:
  workflow_dispatch:
    inputs:
      upstream_run:
        description: Completed primary benchmark run containing all five frozen few-shot searches
        required: true
        default: '35340617823'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  live:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Retrieve a complete authorized upstream capture
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN: ${{ inputs.upstream_run }}
        run: |
          [[ "$UPSTREAM_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$UPSTREAM_RUN" --repo CompleteDotTech/paper-package --name dspy-live-relation_support--fewshot_contract --dir "$RUNNER_TEMP/upstream"
      - name: Verify and compare seven workflows using all five frozen prompts
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          CAPTURE="$(find "$RUNNER_TEMP/upstream" -name freeze.json -printf '%h\n' | head -1)"
          test -n "$CAPTURE"
          test -f "$CAPTURE/execution.json"
          python -B -m graph_synthesis.dspy_multicall.run --capture "$CAPTURE" --shard '${{ matrix.shard }}' --output "$RUNNER_TEMP/multicall/shard-${{ matrix.shard }}"
      - name: Preserve raw observations, including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dspy-multicall-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/multicall/
          retention-days: 14
          if-no-files-found: warn
