name: Graph evidence figures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: graph-figures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned rendering and numerical dependencies
        run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Verify regenerated data, SVG, lineage and PNG integrity
        run: python -B -m graph_synthesis.visualize --check
      - name: Test figure accounting and preserved graph semantics
        run: python -B -m unittest discover -s graph_synthesis/tests -v
      - name: Archive figures and exact source data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-figures-${{ github.event.pull_request.head.sha || github.sha }}
          path: graph_synthesis/figures/
          if-no-files-found: error
          retention-days: 90
