name: Graph synthesis research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: graph-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve tracked inputs for verification
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/repository.tar"
      - name: Install pinned original replay dependency
        run: python -m pip install -r graph_synthesis/requirements-verification.txt
      - name: Acquire standalone datasets and verify their pinned hashes
        run: python -B scripts/download_datasets.py
      - name: Verify immutable inputs and replay original observations and tests
        run: python -B -m graph_synthesis.verify --replay --tests --output "$RUNNER_TEMP/frozen-verification.json"
      - name: Test relationship semantics, provenance, lifecycle and adapters
        run: |
          set -o pipefail
          python -B -m unittest discover -s graph_synthesis/tests -v 2>&1 | tee "$RUNNER_TEMP/extension-tests.log"
      - name: Reproduce graph study and compare committed results
        run: |
          python -B -m graph_synthesis.study --output "$RUNNER_TEMP/graph-study.json"
          python - <<'PY'
          import gzip, json, os, pathlib
          from graph_synthesis.verify import compare_json
          expected = json.loads(gzip.decompress(pathlib.Path('graph_synthesis/results/graph-study.json.gz').read_bytes()))
          actual = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'graph-study.json').read_bytes())
          print('Cross-runtime roundoff:', compare_json(expected, actual))
          PY
      - name: Archive tracked sources and executed reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graph-study-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/repository.tar
            ${{ runner.temp }}/frozen-verification.json
            ${{ runner.temp }}/extension-tests.log
            ${{ runner.temp }}/graph-study.json
          if-no-files-found: error
          retention-days: 7
