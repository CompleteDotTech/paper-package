name: Graph synthesis research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: graph-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact tracked inputs for independent local verification
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/repository.tar"
      - name: Install replay dependencies
        run: python -m pip install -r reproduction/requirements-jev.txt
      - name: Reconstruct immutable package and replay original observations
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          root = pathlib.Path.cwd()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frozen-package'
          target.mkdir()
          raw = (root / 'MANIFEST.json').read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if blob != '3837504455f0bac580496858f3f0ba99f795fe6c':
              raise ValueError('The frozen inventory was changed')
          shutil.copy2(root / 'MANIFEST.json', target / 'MANIFEST.json')
          for row in json.loads(raw)['files']:
              relative = pathlib.Path(row['path'])
              source = (root / relative).resolve()
              if not source.is_relative_to(root) or source.is_symlink():
                  raise ValueError('Unsafe inventory path')
              dest = target / relative
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, dest)
          subprocess.run([sys.executable, '-B', str(target / 'scripts/verify_package.py'), '--replay',
                          '--output', str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'frozen-verification.json')], check=True)
          PY
      - name: Run graph extension unit and integration tests
        run: |
          if [ -d graph_synthesis/tests ]; then
            python -B -m unittest discover -s graph_synthesis/tests -v
          fi
      - name: Run graph study on frozen Jev decisions
        run: |
          if [ -f graph_synthesis/study.py ]; then
            python -B -m graph_synthesis.study --repository . --output "$RUNNER_TEMP/graph-study.json"
          fi
      - name: Archive tracked inputs and executed research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-study-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/repository.tar
            ${{ runner.temp }}/frozen-verification.json
            ${{ runner.temp }}/graph-study.json
          if-no-files-found: error
          retention-days: 7
