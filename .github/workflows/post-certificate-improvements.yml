name: Post-certificate structural improvements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify frozen protocol ancestry and bytes
        shell: bash
        run: |
          set -euo pipefail
          protocol=8187cc4e4b98e40f3146ce787b71f262b62b3abd
          git merge-base --is-ancestor "$protocol" HEAD
          git show "$protocol:graph_synthesis/post_certificate/PROTOCOL.md" | cmp - graph_synthesis/post_certificate/PROTOCOL.md
          python -B -m graph_synthesis.verify
      - name: Focused regressions and frozen replay
        run: |
          python -B -m unittest discover -s graph_synthesis/post_certificate/tests -v
          python -B -m graph_synthesis.post_certificate.run --check
          python -B -m graph_synthesis.post_certificate.report --check --update-paper
      - name: Install rendering dependencies
        run: |
          python -m pip install -r graph_synthesis/requirements-figures.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Verify committed build hashes and deterministic manuscript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          b=json.loads(Path('manuscript/paper-current.build.json').read_text(encoding='utf-8'))
          assert sha('manuscript/paper-current.md')==b['source_sha256']
          assert sha('graph_synthesis/render_current_paper.py')==b['renderer_sha256']
          assert sha('manuscript/paper-current.pdf')==b['pdf_sha256']
          PY
          python -B -m graph_synthesis.render_current_paper --output "$RUNNER_TEMP/post-certificate-paper.pdf"
          git diff --exit-code -- manuscript/paper-current.md manuscript/paper-current.html
          git diff --check
      - name: PDF structural and raster smoke check
        shell: bash
        run: |
          set -euo pipefail
          pdf="$RUNNER_TEMP/post-certificate-paper.pdf"
          pdfinfo "$pdf" | tee "$RUNNER_TEMP/pdfinfo.txt"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "${pages:-0}" -gt 0
          pdftoppm -f 1 -singlefile -png -r 120 "$pdf" "$RUNNER_TEMP/paper-first"
          pdftoppm -f "$pages" -singlefile -png -r 120 "$pdf" "$RUNNER_TEMP/paper-last"
          test -s "$RUNNER_TEMP/paper-first.png"
          test -s "$RUNNER_TEMP/paper-last.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: post-certificate-pdf-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/post-certificate-paper.pdf
            ${{ runner.temp }}/post-certificate-paper.build.json
            ${{ runner.temp }}/pdfinfo.txt
            ${{ runner.temp }}/paper-first.png
            ${{ runner.temp }}/paper-last.png
          if-no-files-found: warn
          retention-days: 14
