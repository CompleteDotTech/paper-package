name: Post-certificate benchmark publisher

on:
  push:
    branches:
      - research/post-certificate-improvements-final-20260918

permissions:
  contents: write

concurrency:
  group: post-certificates-publisher-final
  cancel-in-progress: false

jobs:
  execute-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[post-certificates generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install frozen research dependencies
        run: python -m pip install -r graph_synthesis/post_certificates/requirements.txt
      - name: Verify frozen protocol ancestry
        shell: bash
        run: |
          set -euo pipefail
          protocol=f923e8d41ca5953d9793fadcc3730cfe9fc70b3a
          git merge-base --is-ancestor "$protocol" HEAD
          git show "$protocol:graph_synthesis/post_certificates/PROTOCOL.md" | cmp - graph_synthesis/post_certificates/PROTOCOL.md
      - name: Run mechanism tests
        run: python -B -m unittest discover -s graph_synthesis/post_certificates/tests -v
      - name: Execute frozen benchmarks
        run: |
          python -B -m graph_synthesis.post_certificates.run
          python -B -m graph_synthesis.post_certificates.run --check
      - name: Generate report, figures and complete manuscript
        run: |
          python -B -m graph_synthesis.post_certificates.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
      - name: Publish generated evidence to this research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- graph_synthesis/post_certificates CURRENT_RESULTS.md manuscript
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "research: execute frozen post-certificate benchmarks [post-certificates generated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
