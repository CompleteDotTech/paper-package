name: Post-certificate research

on:
  pull_request:
    paths:
      - "graph_synthesis/post_certificates/**"
      - "CURRENT_RESULTS.md"
      - "manuscript/paper-current.*"
      - ".github/workflows/post-certificates.yml"
  push:
    branches:
      - main
    paths:
      - "graph_synthesis/post_certificates/**"
      - "CURRENT_RESULTS.md"
      - "manuscript/paper-current.*"
      - ".github/workflows/post-certificates.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install frozen research dependencies
        run: python -m pip install -r graph_synthesis/post_certificates/requirements.txt
      - name: Verify frozen protocol ancestry
        shell: bash
        run: |
          set -euo pipefail
          protocol=f923e8d41ca5953d9793fadcc3730cfe9fc70b3a
          git merge-base --is-ancestor "$protocol" HEAD
          git show "$protocol:graph_synthesis/post_certificates/PROTOCOL.md" | cmp - graph_synthesis/post_certificates/PROTOCOL.md
      - name: Run mechanism tests
        run: python -B -m unittest discover -s graph_synthesis/post_certificates/tests -v
      - name: Reproduce committed machine-readable evidence
        run: python -B -m graph_synthesis.post_certificates.run --check
      - name: Rebuild report, figures and complete manuscript
        run: |
          python -B -m graph_synthesis.post_certificates.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
      - name: Require generated-artifact stability
        shell: bash
        run: |
          set -euo pipefail
          # SVG object IDs and PDF bytes are renderer-dependent; verify the
          # machine-readable evidence, narrative sources, HTML, and PNG plots.
          git diff --exit-code -- \
            CURRENT_RESULTS.md \
            graph_synthesis/post_certificates/PROTOCOL.md \
            graph_synthesis/post_certificates/RESULTS.md \
            graph_synthesis/post_certificates/results.json \
            graph_synthesis/post_certificates/summary.csv \
            graph_synthesis/post_certificates/figures/*.png \
            manuscript/paper-current.md \
            manuscript/paper-current.html
