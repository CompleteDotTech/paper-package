name: Relationship experiments
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: relationship-experiments-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve reviewed source
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/relationship-source.tar"
      - name: Install numerical replay dependency
        run: python -m pip install -r reproduction/requirements-jev.txt
      - name: Run original and new graph tests
        run: python -B -m unittest discover -s graph_synthesis/tests -v 2>&1 | tee "$RUNNER_TEMP/relationship-tests.log"
      - name: Reproduce and compare committed experiment reference
        run: python -B experiments/relationships/reproduce.py --output "$RUNNER_TEMP/relationship-results"
      - name: Archive exact source, full journals, comparisons, and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationships-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/relationship-source.tar
            ${{ runner.temp }}/relationship-tests.log
            ${{ runner.temp }}/relationship-results/
          if-no-files-found: error
          retention-days: 90
