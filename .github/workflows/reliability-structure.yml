name: Reliability and structural experiments
on:
  push:
    branches: [main, research/reliability-structure-lifecycle]
  pull_request:
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  execute-and-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/reliability-structure-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Execute all five frozen tests and check replay
        shell: bash
        run: |
          set -euo pipefail
          python -B -m graph_synthesis.reliability.run | tee graph_synthesis/reliability/execution.log
          python -B -m unittest discover -s graph_synthesis/reliability/tests -v 2>&1 | tee graph_synthesis/reliability/tests.log
          python -B -m graph_synthesis.reliability.run --check
          python -B -m graph_synthesis.verify --output graph_synthesis/reliability/original-inventory.json
          python -B -m graph_synthesis.reliability.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
      - name: Commit generated research artifacts on this research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph_synthesis/reliability CURRENT_RESULTS.md manuscript/paper-current.md manuscript/paper-current.pdf manuscript/paper-current.html manuscript/paper-current.build.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record executed reliability results, figures and complete updated manuscript'
            git push origin HEAD:research/reliability-structure-lifecycle
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reliability-review-package
          path: |
            graph_synthesis/reliability/
            manuscript/paper-current.pdf
            manuscript/paper-current.md
            manuscript/paper-current.html
            manuscript/paper-current.build.json
            CURRENT_RESULTS.md
          retention-days: 14
  replay:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r reproduction/requirements-jev.txt
      - name: Regression tests, exact results replay and archived evidence integrity
        run: |
          python -B -m unittest discover -s graph_synthesis/reliability/tests -v
          python -B -m graph_synthesis.reliability.run --check
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/reliability-original.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest=json.loads(Path('graph_synthesis/reliability/artifact-manifest.json').read_text(encoding='utf-8'))
          for path,want in manifest['sha256'].items():
              assert sha(path)==want,path
          build=json.loads(Path('manuscript/paper-current.build.json').read_text(encoding='utf-8'))
          assert sha('manuscript/paper-current.md')==build['source_sha256']
          assert sha('graph_synthesis/render_current_paper.py')==build['renderer_sha256']
          assert sha('manuscript/paper-current.pdf')==build['pdf_sha256']
          r=json.loads(Path('graph_synthesis/reliability/results.json').read_text(encoding='utf-8'))
          assert all(f['group'] not in f['fit_groups'] for f in r['H1']['folds'])
          assert r['fresh_service_calls']==0
          print('Source, result, PDF and fit-group provenance verified')
          PY
          git diff --exit-code
  figures-and-paper:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Regenerate figures and paper without drifting archived studies
        run: |
          python -B -m graph_synthesis.reliability.report --figures --update-paper
          git diff --exit-code -- graph_synthesis/reliability manuscript/paper-current.md CURRENT_RESULTS.md
          python -B -m graph_synthesis.render_current_paper --output "$RUNNER_TEMP/reliability-paper.pdf"
          git diff --exit-code -- manuscript/paper-current.html
