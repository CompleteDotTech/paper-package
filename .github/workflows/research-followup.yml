name: Five improvement follow-up
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-followup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: New regression tests and corpus regressions
        run: |
          set -o pipefail
          python -B -m unittest discover -s graph_synthesis/followup/tests -v 2>&1 | tee "$RUNNER_TEMP/followup-tests.log"
          python -B -m unittest discover -s graph_synthesis/corpus/tests -v 2>&1 | tee "$RUNNER_TEMP/corpus-tests.log"
      - name: Reproduce five hypotheses and prior falsification
        run: |
          python -B -m graph_synthesis.followup.run --check
          python -B -m graph_synthesis.falsification --check
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/frozen-verification.json"
      - name: Verify source, figure and committed PDF integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest=json.loads(Path('graph_synthesis/followup/artifact-manifest.json').read_text())
          for path,want in manifest['sha256'].items():
              assert sha(path)==want,('Artifact hash mismatch',path)
          build=json.loads(Path('manuscript/paper-current.build.json').read_text())
          assert sha('manuscript/paper-current.md')==build['source_sha256']
          assert sha('graph_synthesis/render_current_paper.py')==build['renderer_sha256']
          assert sha('manuscript/paper-current.pdf')==build['pdf_sha256']
          assert Path('manuscript/paper-current.pdf').read_bytes().startswith(b'%PDF-')
          print('Verified',len(manifest['sha256']),'follow-up files and current PDF provenance')
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: followup-validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/followup-tests.log
            ${{ runner.temp }}/corpus-tests.log
            ${{ runner.temp }}/frozen-verification.json
          retention-days: 14
  paper-and-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Reproduce five figures and additive manuscript section
        run: |
          python -B -m graph_synthesis.followup.report --figures --update-paper
          git diff --exit-code -- graph_synthesis/followup manuscript/paper-current.md CURRENT_RESULTS.md
          python -B -m graph_synthesis.render_current_paper --output "$RUNNER_TEMP/paper-current.pdf"
          git diff --exit-code -- manuscript/paper-current.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: followup-rendered-paper
          path: |
            ${{ runner.temp }}/paper-current.pdf
            ${{ runner.temp }}/paper-current.build.json
          retention-days: 14
