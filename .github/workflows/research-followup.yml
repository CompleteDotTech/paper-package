name: Five improvement follow-up
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: five-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate-reviewed-artifacts:
    if: github.repository == 'CompleteDotTech/paper-package' && github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/five-followup-improvements-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Execute hypotheses and regression tests
        run: |
          python -B -m unittest discover -s graph_synthesis/followup/tests -v
          python -B -m graph_synthesis.followup.run
          python -B -m graph_synthesis.followup.run --check
          python -B -m graph_synthesis.followup.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
          python -B -m graph_synthesis.verify --output /tmp/frozen-verification.json
          python -B -m graph_synthesis.falsification --check
      - name: Commit only generated follow-up artifacts to authorized research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph_synthesis/followup/results.json graph_synthesis/followup/RESULTS.md graph_synthesis/followup/artifact-manifest.json graph_synthesis/followup/figures CURRENT_RESULTS.md manuscript/paper-current.md manuscript/paper-current.html manuscript/paper-current.pdf manuscript/paper-current.build.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish executed five-hypothesis evidence, figures and current paper'
            git push origin HEAD:refs/heads/research/five-followup-improvements-20260918
          fi
          git archive --format=tar.gz HEAD -o /tmp/followup-generated-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: followup-generated-source
          path: |
            /tmp/followup-generated-source.tar.gz
            /tmp/frozen-verification.json
          retention-days: 7
