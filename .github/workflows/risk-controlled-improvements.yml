name: Risk-controlled improvement experiments
on:
  push:
    branches: [research/jev-risk-controlled-improvements]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/research/jev-risk-controlled-improvements' && contains(github.event.head_commit.message, '[build-risk]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and materialize tested public source
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,shutil
          from pathlib import Path
          data=base64.b64decode(''.join(Path(f'.research-risk/part{i:02}.b64').read_text() for i in range(1,5)),validate=True)
          assert hashlib.sha256(data).hexdigest()=='45500275b6a0861e873550445be6311ec83701e80b59c4479e6126a06adb067e'
          files=json.loads(gzip.decompress(data))
          allowed={'graph_synthesis/render_current_paper.py'}
          allowed.update('graph_synthesis/risk_control/'+p for p in ['CLAIM_EVIDENCE.md','README.md','__init__.py','environment-local.json','methods.py','report.py','run.py','tests/test_methods.py','tests/test_reporting.py','validation/execution.log','validation/local-replay.log','validation/local-unit-tests.log'])
          assert set(files)==allowed
          for path,text in files.items():
              target=Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(text,encoding='utf-8',newline='\n')
          shutil.rmtree('.research-risk')
          print('Verified and materialized',len(files),'tested source and local-validation files')
          PY
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Execute all five frozen benchmarks and generate figures
        run: |
          set -euo pipefail
          python -B -m graph_synthesis.risk_control.run | tee graph_synthesis/risk_control/validation/ci-execution.log
          python -B -m graph_synthesis.risk_control.report --figures --update-paper
      - name: Regression tests, exact replay and immutable original audit
        run: |
          set -euo pipefail
          python -B -m unittest discover -s graph_synthesis/risk_control/tests -v 2>&1 | tee graph_synthesis/risk_control/validation/ci-unit-tests.log
          python -B -m graph_synthesis.risk_control.run --check | tee graph_synthesis/risk_control/validation/ci-replay.log
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/risk-original-inventory.json"
          cp "$RUNNER_TEMP/risk-original-inventory.json" graph_synthesis/risk_control/validation/original-inventory.json
      - name: Render complete paper and bind research artifacts
        run: |
          python - <<'PY'
          import json,platform,sys,numpy,matplotlib,weasyprint
          from pathlib import Path
          out={'execution':'Actual GitHub Actions offline execution and replay after local execution','python':sys.version,'platform':platform.system(),'numpy':numpy.__version__,'matplotlib':matplotlib.__version__,'weasyprint':weasyprint.__version__}
          Path('graph_synthesis/risk_control/environment-ci.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          PY
          python -B -m graph_synthesis.risk_control.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('graph_synthesis/risk_control/artifact-manifest.json').read_text())
          for p,h in m['sha256'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          print('All new artifact hashes verified')
          PY
      - name: Commit only authorized research changes to the research branch
        run: |
          git add -A
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'CURRENT_RESULTS.md','graph_synthesis/render_current_paper.py','manuscript/paper-current.md','manuscript/paper-current.html','manuscript/paper-current.pdf','manuscript/paper-current.build.json'}
          for p in names:
              assert p in allowed or p.startswith('graph_synthesis/risk_control/') or p.startswith('.research-risk/'),p
          assert not __import__('pathlib').Path('.research-risk').exists()
          print('Reviewed change boundary:',len(names),'paths')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Execute five risk-control experiments, retain null results and update full paper'
          git push origin HEAD:research/jev-risk-controlled-improvements
          git archive --format=tar HEAD > "$RUNNER_TEMP/risk-completed-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: risk-completed-research
          path: ${{ runner.temp }}/risk-completed-source.tar
          retention-days: 14
