name: Source-aware structural experiments
on:
  push:
    branches: [main, research/source-risk-structure]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  execute-and-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/source-risk-structure' && contains(github.event.head_commit.message, '[execute source-structure]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Execute five frozen tests, regressions and original evidence audit
        shell: bash
        run: |
          set -euo pipefail
          python -B -m graph_synthesis.source_structural.run | tee graph_synthesis/source_structural/execution.log
          python -B -m unittest discover -s graph_synthesis/source_structural/tests -v 2>&1 | tee graph_synthesis/source_structural/tests.log
          python -B -m graph_synthesis.source_structural.run --check
          python - <<'PYTEST'
          import json,re,subprocess,sys
          from pathlib import Path
          folders=['graph_synthesis/tests','graph_synthesis/corpus/tests','graph_synthesis/theory_suite/tests','graph_synthesis/followup/tests','graph_synthesis/adaptive/tests','graph_synthesis/risk_control/tests','graph_synthesis/reliability/tests','graph_synthesis/structural/tests','graph_synthesis/source_structural/tests']
          records=[]
          with Path('graph_synthesis/source_structural/combined-tests.log').open('w',encoding='utf-8',newline='\n') as log:
              for folder in folders:
                  p=subprocess.run([sys.executable,'-B','-m','unittest','discover','-s',folder,'-v'],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  log.write('\n### '+folder+'\n'+p.stdout)
                  match=re.search(r'Ran (\d+) tests?',p.stdout)
                  count=int(match[1]) if match else 0
                  records.append({'suite':folder,'tests':count,'passed':p.returncode==0})
                  if p.returncode or not count:
                      raise RuntimeError(folder+'\n'+p.stdout)
          Path('graph_synthesis/source_structural/combined-validation.json').write_text(json.dumps({'suites':records,'total_tests':sum(r['tests'] for r in records),'all_passed':True},indent=2)+'\n',encoding='utf-8',newline='\n')
          print('All',sum(r['tests'] for r in records),'integrated regression tests passed')
          PYTEST
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/source-original-inventory.json"
          cp "$RUNNER_TEMP/source-original-inventory.json" graph_synthesis/source_structural/original-inventory.json
          python -B -m graph_synthesis.source_structural.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
      - name: Commit executed artifacts on the research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graph_synthesis/source_structural CURRENT_RESULTS.md manuscript/paper-current.md manuscript/paper-current.pdf manuscript/paper-current.html manuscript/paper-current.build.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record source-risk and structural benchmarks with complete manuscript and figures'
            git push origin HEAD:research/source-risk-structure
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-structure-review-package
          path: |
            graph_synthesis/source_structural/
            manuscript/paper-current.pdf
            manuscript/paper-current.md
            manuscript/paper-current.html
            manuscript/paper-current.build.json
            CURRENT_RESULTS.md
          retention-days: 14
      - name: Archive exact integrated source for independent inspection
        run: git archive --format=zip --output="$RUNNER_TEMP/source-structure-integrated.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-structure-integrated-source
          path: ${{ runner.temp }}/source-structure-integrated.zip
          retention-days: 14
  replay:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r reproduction/requirements-jev.txt
      - name: Regression tests, offline replay and provenance
        run: |
          python -B -m unittest discover -s graph_synthesis/source_structural/tests -v
          python -B -m graph_synthesis.source_structural.run --check
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/source-original.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          m=json.loads(Path('graph_synthesis/source_structural/artifact-manifest.json').read_text(encoding='utf-8'))
          for path,want in m['sha256'].items():
              assert sha(path)==want,path
          b=json.loads(Path('manuscript/paper-current.build.json').read_text(encoding='utf-8'))
          assert sha('manuscript/paper-current.md')==b['source_sha256']
          assert sha('graph_synthesis/render_current_paper.py')==b['renderer_sha256']
          assert sha('manuscript/paper-current.pdf')==b['pdf_sha256']
          r=json.loads(Path('graph_synthesis/source_structural/results.json').read_text(encoding='utf-8'))
          assert all(f['group'] not in f['fit_groups'] for f in r['H1']['folds'])
          assert r['fresh_service_calls']==0
          for path,want in r['source_hashes'].items():
              assert sha(path)==want,path
          print('Source, result, PDF and fit-group provenance verified')
          PY
          git diff --exit-code
  figures-and-paper:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Deterministic report, figure and complete-paper regeneration
        run: |
          python -B -m graph_synthesis.source_structural.report --figures --update-paper
          git diff --exit-code -- graph_synthesis/source_structural manuscript/paper-current.md CURRENT_RESULTS.md
          python -B -m graph_synthesis.render_current_paper --output "$RUNNER_TEMP/source-paper.pdf"
          git diff --exit-code -- manuscript/paper-current.html
