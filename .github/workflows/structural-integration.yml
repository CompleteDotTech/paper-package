name: Integrate concurrent research
on:
  push:
    branches: [research/structural-refinements-20260918]
permissions:
  contents: read
jobs:
  integrate:
    if: github.ref == 'refs/heads/research/structural-refinements-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Merge the pinned concurrently completed study and preserve both sections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          base='a62a3257645d8e35cd4e45be53bfa9511d27724b'
          subprocess.run(['git','fetch','origin',base],check=True)
          merged=subprocess.run(['git','merge','--no-commit','--no-ff',base])
          assert merged.returncode in (0,1)
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed={'CURRENT_RESULTS.md','manuscript/paper-current.md','manuscript/paper-current.html','manuscript/paper-current.pdf','manuscript/paper-current.build.json','graph_synthesis/render_current_paper.py','.github/workflows/jev-multicall.yml'}
          assert set(conflicts)<=allowed,conflicts
          for path in conflicts:
              subprocess.run(['git','checkout','--theirs','--',path],check=True)
          # Rebuild mutable shared artifacts from main, never edit archived results.
          for path in allowed:
              data=subprocess.check_output(['git','show',base+':'+path])
              Path(path).write_bytes(data)
          path=Path('graph_synthesis/render_current_paper.py')
          text=path.read_text();needle='FOLLOWUP|ADAPTIVE|RISK_CONTROL'
          assert needle in text
          if '|STRUCTURAL' not in text:text=text.replace(needle,needle+'|STRUCTURAL')
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('.github/workflows/jev-multicall.yml')
          text=path.read_text();needle='          python -B -m graph_synthesis.reliability.report --update-paper\n'
          assert text.count(needle)==1
          text=text.replace(needle,needle+'          python -B -m graph_synthesis.structural.report --update-paper\n')
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('graph_synthesis/structural/report.py')
          text=path.read_text()
          old="    if text.count(ANCHOR) != 1:\n        raise ValueError('Expected one risk-control anchor')\n    before, after = text.split(ANCHOR, 1)\n    return before+ANCHOR+"
          new="    anchor = '<!-- RELIABILITY_RESEARCH_END -->' if '<!-- RELIABILITY_RESEARCH_END -->' in text else ANCHOR\n    if text.count(anchor) != 1:\n        raise ValueError('Expected one predecessor research anchor')\n    before, after = text.split(anchor, 1)\n    return before+anchor+"
          assert text.count(old)==1
          text=text.replace(old,new)
          needle="        '## 9. Reproduction and claim audit', '',"
          addition="        '### Concurrent study and overlap', '',\n        'PR #17 merged while this extension was executing. Both studies began from PR #16 and froze protocols independently before their own runs. Its small-lineage Shannon evaluator and four-vertex cycle-cutset solver overlap with H4/H5 here; those mechanisms are not claimed as new relative to PR #17. H4 here additionally tests exact shared-hub formulas through 256 atoms, whereas that implementation caps each exact component at 16 atoms. H5 supplies a separate implementation and a different sixteen-cycle fixture grid, not a new optimization mechanism. The two studies reuse the same semantic capture and their sample counts or outcomes must not be pooled as independent evidence. Both reports and all original artifacts are preserved in the integrated manuscript.', '',\n"
          assert text.count(needle)==1
          text=text.replace(needle,addition+needle)
          path.write_text(text,encoding='utf-8',newline='\n')
          path=Path('graph_synthesis/structural/README.md')
          path.write_text(path.read_text()+'\n## Concurrent integration\n\nPR #17 completed in parallel from the same PR #16 baseline. Its exact-lineage and cycle-cutset mechanisms overlap with H4/H5 here. This extension adds the specified larger lineage-capacity evaluation and separate cyclic fixtures; it does not claim those mechanisms are newly introduced relative to PR #17. Both studies remain separate exploratory evidence, not independent semantic samples. The shared manuscript preserves both sections.\n',encoding='utf-8',newline='\n')
          tests='''"""Preserve concurrently merged research under either report rebuild order."""
          import unittest
          from graph_synthesis.structural.report import insert, START, END, ANCHOR
          from graph_synthesis.reliability.report import replace_after_anchor
          class IntegrationTests(unittest.TestCase):
              def test_prior_baseline(self):
                  text=insert('prior'+ANCHOR+'\\nlegacy','structural')
                  self.assertIn('structural',text)
                  self.assertTrue(text.endswith('legacy'))
              def test_reliability_precedes_structural(self):
                  text=insert(replace_after_anchor('prior'+ANCHOR+'\\nlegacy','reliability'),'structural')
                  self.assertLess(text.index('<!-- RELIABILITY_RESEARCH_END -->'),text.index(START))
                  self.assertEqual(text.count(END),1)
              def test_idempotent(self):
                  text=insert(replace_after_anchor('prior'+ANCHOR+'\\nlegacy','reliability'),'structural')
                  self.assertEqual(text,insert(text,'structural'))
                  self.assertEqual(text,replace_after_anchor(text,'reliability'))
              def test_rebuild_order_commutes(self):
                  base='prior'+ANCHOR+'\\nlegacy'
                  first=insert(replace_after_anchor(base,'reliability'),'structural')
                  second=replace_after_anchor(insert(base,'structural'),'reliability')
                  self.assertEqual(first,second)
          '''
          Path('graph_synthesis/structural/tests/test_reporting_integration.py').write_text(tests,encoding='utf-8',newline='\n')
          path=Path('.github/workflows/structural-refinements.yml')
          path.write_text(path.read_text().replace('Run 32 regressions','Run 36 regressions'),encoding='utf-8',newline='\n')
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          print('Resolved only mutable manuscript/build conflicts; prior evidence untouched')
          PY
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Validate the combined 565-test suite and reproduce both studies
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,subprocess,sys
          from graph_synthesis.structural.run import HERE,write
          counts={}
          for name in ('tests','corpus/tests','theory_suite/tests','followup/tests','adaptive/tests','risk_control/tests','reliability/tests','structural/tests'):
              directory='graph_synthesis/'+name
              run=subprocess.run([sys.executable,'-B','-m','unittest','discover','-s',directory,'-v'],text=True,capture_output=True)
              text=run.stdout+run.stderr
              print(text if run.returncode else text[-300:])
              assert run.returncode==0,directory
              counts[directory]=int(re.search(r'Ran (\d+) tests',text).group(1))
          assert sum(counts.values())==565,counts
          for module in ('graph_synthesis.structural.run','graph_synthesis.reliability.run'):
              subprocess.run([sys.executable,'-B','-m',module,'--check'],check=True)
          subprocess.run([sys.executable,'-B','-m','graph_synthesis.verify','--output',os.environ['RUNNER_TEMP']+'/integrated-original-inventory.json'],check=True)
          for directory in ('graph_synthesis/reliability','graph_synthesis/risk_control'):
              manifest=json.loads(Path(directory+'/artifact-manifest.json').read_text())
              for path,want in manifest['sha256'].items():
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==want,path
          write(HERE/'validation-integration.json',{'base_main':'a62a3257645d8e35cd4e45be53bfa9511d27724b','source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'test_counts':counts,'total_tests_passed':sum(counts.values()),'both_study_replays_verified':True,'prior_reliability_and_risk_artifacts_unchanged':True,'results_sha256':hashlib.sha256((HERE/'results.json').read_bytes()).hexdigest()})
          PY
      - name: Regenerate the additive paper and verify rebuild order
        run: |
          python -B -m graph_synthesis.structural.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
          python - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,sys
          paths=['manuscript/paper-current.md','CURRENT_RESULTS.md']
          before={p:Path(p).read_bytes() for p in paths}
          for module in ('graph_synthesis.reliability.report','graph_synthesis.structural.report','graph_synthesis.reliability.report'):
              subprocess.run([sys.executable,'-B','-m',module,'--update-paper'],check=True)
          assert all(Path(p).read_bytes()==value for p,value in before.items())
          subprocess.run(['git','diff','--exit-code','--','graph_synthesis/reliability'],check=True)
          assert not Path('.structural-source').exists()
          print('Both research sections retained with order-independent regeneration')
          PY
      - name: Commit the real merge and artifacts to the authorized research branch
        run: |
          git add graph_synthesis/structural graph_synthesis/render_current_paper.py .github/workflows/jev-multicall.yml .github/workflows/structural-refinements.yml CURRENT_RESULTS.md manuscript/paper-current.md manuscript/paper-current.html manuscript/paper-current.pdf manuscript/paper-current.build.json
          git diff --cached --stat
          git commit -m 'research: preserve concurrent PR 17, disclose overlap, and verify 565 combined tests'
          git push origin HEAD:research/structural-refinements-20260918
      - name: Package integrated committed research
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('/tmp/integrated-research.zip','w',ZIP_DEFLATED) as z:
              for p in sorted(Path('.').rglob('*')):
                  if p.is_file() and '.git' not in p.parts and '__pycache__' not in p.parts:z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-structural-research
          path: /tmp/integrated-research.zip
          retention-days: 14
