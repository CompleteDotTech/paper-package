name: Structural refinement experiments
on:
  push:
    branches: [research/structural-refinements-20260918]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-research:
    if: github.ref == 'refs/heads/research/structural-refinements-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore locally validated source through checksum-bound transfer
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,shutil,zlib
          directory=Path('.structural-source')
          payload=''.join((directory/f'part{i}.b64').read_text() for i in range(4))
          data=zlib.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(data).hexdigest()=='d25bdc83fb3e51eeacd806c0dadd95d2afb54b526c2ed7e2d6fb638442a2f610'
          files=json.loads(data)
          expected={'graph_synthesis/structural/'+p for p in ('__init__.py','methods.py','run.py','report.py','tests/test_structural.py','README.md','CLAIM_EVIDENCE.md','environment-local.json','validation-local.json')}
          expected.add('graph_synthesis/render_current_paper.py')
          assert set(files)==expected
          for name,text in files.items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8',newline='\n')
          shutil.rmtree(directory)
          print('Restored ten checksum-verified text files; transfer removed')
          PY
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Execute five hypotheses and all regression suites
        run: |
          python -B -m graph_synthesis.structural.run
          python - <<'PY'
          from pathlib import Path
          import hashlib,importlib.metadata,json,os,platform,re,shutil,subprocess,sys
          from graph_synthesis.structural.run import HERE,write
          logs=Path(os.environ['RUNNER_TEMP'])/'structural-logs';logs.mkdir()
          counts={}
          for directory in ('graph_synthesis/tests','graph_synthesis/corpus/tests','graph_synthesis/theory_suite/tests','graph_synthesis/followup/tests','graph_synthesis/adaptive/tests','graph_synthesis/risk_control/tests','graph_synthesis/structural/tests'):
              result=subprocess.run([sys.executable,'-B','-m','unittest','discover','-s',directory,'-v'],text=True,capture_output=True)
              text=result.stdout+result.stderr
              (logs/(directory.replace('/','_')+'.log')).write_text(text)
              print(text[-600:])
              assert result.returncode==0,directory
              counts[directory]=int(re.search(r'Ran (\d+) tests',text).group(1))
          subprocess.run([sys.executable,'-B','-m','graph_synthesis.structural.run','--check'],check=True)
          inventory=Path(os.environ['RUNNER_TEMP'])/'structural-original-inventory.json'
          subprocess.run([sys.executable,'-B','-m','graph_synthesis.verify','--output',str(inventory)],check=True)
          shutil.copyfile(inventory,HERE/'original-inventory.json')
          actual=hashlib.sha256((HERE/'results.json').read_bytes()).hexdigest()
          local=json.loads((HERE/'environment-local.json').read_text())
          write(HERE/'environment-ci.json',{'python':platform.python_version(),'platform':platform.platform(),'dependencies':{p:importlib.metadata.version(p) for p in ('numpy','matplotlib','markdown-it-py','weasyprint')},'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID']})
          write(HERE/'validation-ci.json',{'test_counts':counts,'total_tests_passed':sum(counts.values()),'replay_verified':True,'results_sha256':actual,'matches_local_results_sha256':actual==local['results_sha256'],'run_id':os.environ['GITHUB_RUN_ID']})
          assert sum(counts.values())==498
          PY
      - name: Regenerate five figures and the complete paper
        run: |
          python -B -m graph_synthesis.structural.report --figures --update-paper
          python -B -m graph_synthesis.render_current_paper --output manuscript/paper-current.pdf
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          for name,want in json.loads(Path('graph_synthesis/structural/artifact-manifest.json').read_text())['sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==want,name
          assert not Path('.structural-source').exists()
          PY
      - name: Commit only research changes on this authorized branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- .structural-source graph_synthesis/structural graph_synthesis/render_current_paper.py manuscript/paper-current.md manuscript/paper-current.html manuscript/paper-current.pdf manuscript/paper-current.build.json CURRENT_RESULTS.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: execute five structural refinements and regenerate full paper'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:research/structural-refinements-20260918
      - name: Package executed source and artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          with ZipFile('/tmp/structural-result.zip','w',ZIP_DEFLATED) as archive:
              for path in sorted(Path('.').rglob('*')):
                  if path.is_file() and '.git' not in path.parts and '__pycache__' not in path.parts:
                      archive.write(path,path.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structural-executed-research
          path: /tmp/structural-result.zip
          retention-days: 14
