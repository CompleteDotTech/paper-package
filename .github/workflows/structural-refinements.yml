name: Structural refinement experiments
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: structural-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r reproduction/requirements-jev.txt
      - name: Verify frozen research artifacts and current PDF provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          manifest=json.loads(Path('graph_synthesis/structural/artifact-manifest.json').read_text(encoding='utf-8'))
          for path,want in manifest['sha256'].items():
              assert sha(path)==want,path
          build=json.loads(Path('manuscript/paper-current.build.json').read_text(encoding='utf-8'))
          assert sha('manuscript/paper-current.md')==build['source_sha256']
          assert sha('graph_synthesis/render_current_paper.py')==build['renderer_sha256']
          assert sha('manuscript/paper-current.pdf')==build['pdf_sha256']
          assert not Path('.structural-source').exists()
          print('Validated',len(manifest['sha256']),'research artifacts and PDF provenance')
          PY
      - name: Run 36 regressions and replay all five frozen outcomes
        run: |
          python -B -m unittest discover -s graph_synthesis/structural/tests -v
          python -B -m graph_synthesis.structural.run --check
          python -B -m graph_synthesis.verify --output "$RUNNER_TEMP/structural-original-inventory.json"
          git diff --exit-code
  figures-and-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r graph_synthesis/requirements-figures.txt
      - name: Reproduce five figures, tables and the additive full paper
        run: |
          python -B -m graph_synthesis.structural.report --figures --update-paper
          git diff --exit-code -- graph_synthesis/structural manuscript/paper-current.md CURRENT_RESULTS.md
          python -B -m graph_synthesis.render_current_paper --output "$RUNNER_TEMP/structural-paper.pdf"
          git diff --exit-code -- manuscript/paper-current.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structural-rendered-paper
          path: |
            ${{ runner.temp }}/structural-paper.pdf
            ${{ runner.temp }}/structural-paper.build.json
            graph_synthesis/structural/figures/
          retention-days: 14
