<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" role="img" aria-labelledby="title desc">
<title id="title">DSPy × TypeSafe AI Jev closed-loop prompt optimization</title>
<desc id="desc">Five-stage architecture showing evidence splits, DSPy prompt proposal, TypeSafe Jev typed execution, validation metrics and champion gate, and a frozen hidden-test report.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#32136d"/><stop offset="1" stop-color="#1c1642"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d3441"/><stop offset="1" stop-color="#10263a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3a2a0b"/><stop offset="1" stop-color="#211907"/></linearGradient>
  <linearGradient id="final" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".38"/></filter>
  <marker id="arrow" markerWidth="15" markerHeight="15" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#94a3b8"/></marker>
  <marker id="arrowGreen" markerWidth="15" markerHeight="15" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#4ade80"/></marker>
  <marker id="arrowRose" markerWidth="15" markerHeight="15" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#fb7185"/></marker>
  <style>
    .title{font:700 66px Inter,Segoe UI,sans-serif;fill:#f8fafc;letter-spacing:.5px}
    .subtitle{font:400 28px Inter,Segoe UI,sans-serif;fill:#94a3b8}
    .section{font:700 30px Inter,Segoe UI,sans-serif;fill:#e2e8f0;letter-spacing:.4px}
    .label{font:700 25px Inter,Segoe UI,sans-serif;fill:#f8fafc}
    .small{font:400 20px Inter,Segoe UI,sans-serif;fill:#cbd5e1}
    .tiny{font:500 18px Inter,Segoe UI,sans-serif;fill:#94a3b8}
    .panel{stroke-width:3;rx:30;filter:url(#shadow)}
    .node{stroke-width:3;rx:22}
    .edge{fill:none;stroke:#94a3b8;stroke-width:5;marker-end:url(#arrow)}
    .edge-green{fill:none;stroke:#4ade80;stroke-width:5;marker-end:url(#arrowGreen)}
    .edge-rose{fill:none;stroke:#fb7185;stroke-width:5;marker-end:url(#arrowRose)}
    .edge-dash{fill:none;stroke:#cbd5e1;stroke-width:4;stroke-dasharray:14 14;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="3840" height="2160" fill="url(#bg)"/>
<circle cx="3420" cy="210" r="390" fill="#7c3aed" opacity=".06"/>
<circle cx="1450" cy="1980" r="520" fill="#06b6d4" opacity=".045"/>
<text x="120" y="130" class="title">DSPy × TypeSafe AI Jev</text>
<text x="120" y="190" class="subtitle">Closed-loop prompt optimization • typed probabilistic decisions • validation-gated search • untouched hidden test</text>

<!-- section panels -->
<rect x="90" y="300" width="575" height="1570" class="panel" fill="#081827" stroke="#164e63"/>
<rect x="720" y="300" width="760" height="1570" class="panel" fill="url(#violet)" stroke="#6d28d9"/>
<rect x="1535" y="300" width="675" height="1570" class="panel" fill="url(#cyan)" stroke="#0e7490"/>
<rect x="2265" y="300" width="815" height="1570" class="panel" fill="url(#gold)" stroke="#a16207"/>
<rect x="3135" y="300" width="615" height="1570" class="panel" fill="url(#final)" stroke="#475569"/>

<text x="130" y="365" class="section">1 · EVIDENCE BOUNDARY</text>
<text x="760" y="365" class="section">2 · DSPy OUTER OPTIMIZER</text>
<text x="1575" y="365" class="section">3 · TYPESAFE AI JEV</text>
<text x="2305" y="365" class="section">4 · OBJECTIVE + GATE</text>
<text x="3175" y="365" class="section">5 · FREEZE + REPORT</text>

<!-- evidence -->
<rect x="145" y="475" width="465" height="175" class="node" fill="#0e2a3f" stroke="#38bdf8"/>
<text x="185" y="535" class="label">TRAIN</text><text x="185" y="575" class="small">Failure analysis only</text><text x="185" y="610" class="tiny">Never selects the final score</text>
<rect x="145" y="725" width="465" height="175" class="node" fill="#0e2a3f" stroke="#38bdf8"/>
<text x="185" y="785" class="label">VALIDATION</text><text x="185" y="825" class="small">Candidate selection</text><text x="185" y="860" class="tiny">Champion gate lives here</text>
<rect x="145" y="1445" width="465" height="205" class="node" fill="#2b173d" stroke="#c084fc"/>
<text x="185" y="1510" class="label">HIDDEN TEST</text><text x="185" y="1550" class="small">One final evaluation</text><text x="185" y="1585" class="tiny">Never feeds DSPy or the gate</text>

<!-- DSPy -->
<rect x="775" y="460" width="650" height="155" class="node" fill="#172554" stroke="#818cf8"/>
<text x="815" y="520" class="label">Baseline Jev configuration</text><text x="815" y="560" class="small">instructions · criteria · thresholds</text>
<rect x="775" y="690" width="650" height="170" class="node" fill="#2e1065" stroke="#a78bfa"/>
<text x="815" y="750" class="label">Failure summarizer</text><text x="815" y="790" class="small">errors · uncertainty · confusion pairs</text>
<rect x="775" y="945" width="650" height="205" class="node" fill="#3b0764" stroke="#c084fc" filter="url(#glow)"/>
<text x="815" y="1010" class="label">DSPy proposal model</text><text x="815" y="1050" class="small">Revise Jev instructions + criteria</text><text x="815" y="1090" class="tiny">Fixed label schema • bounded search budget</text>
<rect x="775" y="1245" width="650" height="170" class="node" fill="#172554" stroke="#818cf8"/>
<text x="815" y="1305" class="label">Candidate configuration k</text><text x="815" y="1345" class="small">Prompt + criteria wording</text>
<rect x="775" y="1540" width="650" height="180" class="node" fill="#1f2937" stroke="#94a3b8"/>
<text x="815" y="1600" class="label">Experiment ledger</text><text x="815" y="1640" class="small">candidate · hashes · scores</text><text x="815" y="1675" class="tiny">Keep winners, rejects, cost + provenance</text>

<!-- Jev -->
<rect x="1590" y="470" width="565" height="160" class="node" fill="#0f2835" stroke="#22d3ee"/>
<text x="1630" y="530" class="label">Structured state</text><text x="1630" y="570" class="small">record · claim · context · graph evidence</text>
<rect x="1590" y="720" width="565" height="160" class="node" fill="#0f2835" stroke="#22d3ee"/>
<text x="1630" y="780" class="label">Typed question set</text><text x="1630" y="820" class="small">Choice · Noul · Score</text>
<ellipse cx="1872" cy="1080" rx="210" ry="115" fill="#3b0764" stroke="#d946ef" stroke-width="7" filter="url(#glow)"/>
<text x="1872" y="1065" text-anchor="middle" class="label">Jev</text><text x="1872" y="1110" text-anchor="middle" class="small">System One execution</text>
<rect x="1590" y="1325" width="565" height="210" class="node" fill="#132e25" stroke="#34d399"/>
<text x="1630" y="1390" class="label">Typed outputs</text><text x="1630" y="1430" class="small">choice / score / noul</text><text x="1630" y="1470" class="small">probabilities · confidence</text>

<!-- Evaluation -->
<rect x="2320" y="455" width="705" height="230" class="node" fill="#3a2a0b" stroke="#fbbf24"/>
<text x="2360" y="520" class="label">Evaluation vector</text><text x="2360" y="562" class="small">accuracy · macro-F1 · MCC</text><text x="2360" y="602" class="small">Brier · log loss · calibration</text><text x="2360" y="642" class="tiny">+ latency · tokens · cost when available</text>
<rect x="2320" y="780" width="705" height="175" class="node" fill="#3a2a0b" stroke="#fbbf24"/>
<text x="2360" y="842" class="label">Selection objective</text><text x="2360" y="884" class="small">Accuracy by default</text><text x="2360" y="918" class="tiny">Macro-F1 / composite are explicit alternatives</text>
<polygon points="2672,1040 2915,1180 2672,1320 2429,1180" fill="#402315" stroke="#fb923c" stroke-width="5"/>
<text x="2672" y="1165" text-anchor="middle" class="label">Beats incumbent</text><text x="2672" y="1205" text-anchor="middle" class="small">on validation?</text>
<rect x="2330" y="1435" width="320" height="165" class="node" fill="#123524" stroke="#4ade80"/>
<text x="2370" y="1495" class="label">PROMOTE</text><text x="2370" y="1536" class="small">New incumbent</text>
<rect x="2700" y="1435" width="320" height="165" class="node" fill="#3a161b" stroke="#fb7185"/>
<text x="2740" y="1495" class="label">REJECT</text><text x="2740" y="1536" class="small">Retain evidence</text>

<!-- Final -->
<rect x="3190" y="565" width="505" height="180" class="node" fill="#172033" stroke="#f8fafc"/>
<text x="3230" y="630" class="label">Freeze champion</text><text x="3230" y="670" class="small">Stop tuning</text><text x="3230" y="705" class="tiny">Lock config + budget + metric</text>
<rect x="3190" y="970" width="505" height="180" class="node" fill="#2b173d" stroke="#c084fc"/>
<text x="3230" y="1035" class="label">Final hidden-test run</text><text x="3230" y="1075" class="small">Evaluation only</text><text x="3230" y="1110" class="tiny">No feedback into optimization</text>
<rect x="3190" y="1385" width="505" height="235" class="node" fill="#172033" stroke="#f8fafc"/>
<text x="3230" y="1450" class="label">Publish artifacts</text><text x="3230" y="1492" class="small">optimized-config.json</text><text x="3230" y="1532" class="small">ledger · metrics · code</text><text x="3230" y="1572" class="small">Mermaid + vector render</text>

